name: Automated Daily Dive Update

on:
  schedule:
    # Runs at 00:05 UTC every day (08:05 Beijing Time)
    - cron: '5 0 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-daily-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Daily Update Engine
        run: npm run update-daily

      - name: Validate Production Build
        run: npm run build

      - name: Commit and Push Daily Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No daily changes detected."
          else
            git commit -m "chore(daily): automated update for Krillion Game #$(date +'%Y-%m-%d')"
            git push
          fi
